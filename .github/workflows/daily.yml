name: Daily scan

on:
  schedule:
    # 13:15 UTC = 6:45 PM IST, Monday–Friday: after NSE publishes its end-of-day files.
    # GitHub may start scheduled runs 5–30 min late; that's fine for an evening alert.
    - cron: "15 13 * * 1-5"
  push:
    paths: [".github/run-now.txt"]   # touch this file to run a scan immediately
  workflow_dispatch:        # "Run workflow" button for manual runs
    inputs:
      rebuild:
        description: "Wipe the track record and replay history again"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # AI news check (2.3.0): Claude Code on your Claude Pro plan. Skipped if the token secret isn't set.
      - name: Install Claude Code
        if: env.HAS_CLAUDE == 'true'
        run: npm install -g @anthropic-ai/claude-code && claude --version

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          UNIVERSE: ${{ vars.UNIVERSE || 'nifty500' }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m scanner.run ${{ github.event.inputs.rebuild == 'true' && '--rebuild' || '' }}

      - name: Save results
        run: |
          git config user.name  "stock-crawler-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data data || true
          git diff --cached --quiet || git commit -m "Scan $(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M IST')"
          git push
