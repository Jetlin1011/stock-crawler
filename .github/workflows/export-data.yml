name: Export research data

on:
  workflow_dispatch:
  push:
    paths: [".github/export-data.txt"]

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m scanner.export_data /tmp/export
      - name: Publish to research-data branch
        run: |
          cd /tmp/export
          git init -q -b research-data
          git config user.name "stock-crawler-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -qm "Research data $(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M IST')"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" research-data
