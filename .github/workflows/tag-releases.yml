name: Tag releases

# Creates a GitHub Release (and its version tag) (with notes from CHANGELOG.md) for every line in .github/releases.txt
on:
  push:
    paths: [".github/releases.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create missing tags and releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          git config user.name "stock-crawler-bot"
          git config user.email "actions@users.noreply.github.com"
          LATEST=$(grep -v '^#' .github/releases.txt | grep -v '^$' | tail -1 | cut -d'|' -f1)
          grep -v '^#' .github/releases.txt | grep -v '^$' | while IFS='|' read -r tag sha title; do
            if ! gh release view "$tag" >/dev/null 2>&1; then
              full=$(git rev-parse "$sha^{commit}")
              ver="${tag#v}"
              awk -v v="$ver" 'index($0, "## " v " ") == 1 {f=1; next} /^## / {if (f) exit} f' CHANGELOG.md > notes.md
              latest="--latest=false"; [ "$tag" = "$LATEST" ] && latest="--latest"
              gh release create "$tag" --target "$full" --title "$tag: $title" --notes-file notes.md $latest >> release-log.txt 2>&1 \
                || echo "FAILED $tag" >> release-log.txt
            fi
          done
          echo "done $(date -u)" >> release-log.txt
      - name: Save log
        if: always()
        run: |
          cat release-log.txt 2>/dev/null || true
